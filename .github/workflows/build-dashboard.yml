name: Deploy static site (optional fallback)

# Docelowe uruchomienie: lokalny Docker na Dell Wyse (patrz README).
# Ten workflow jest tylko opcjonalnym fallbackiem dla GitHub Pages.
# UWAGA: GitHub Pages nie ma backendu, więc notowania na żywo nie będą działać
# (Yahoo Finance blokuje CORS). Strona pokaże import i koszt bazowy.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy reference data into site
        run: |
          mkdir -p site/data/reference
          cp data/reference/*.yaml site/data/reference/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
